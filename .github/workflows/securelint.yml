name: SecureLint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  securelint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, to find the changed lines
          persist-credentials: false
      # Pinned to a commit of SecureLint, like every other action.
      - uses: Fatennhrb/SecureLint@4e82c757b7d459ec90a8c3a4c9c58f23f1c2a4b0
