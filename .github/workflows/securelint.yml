name: SecureLint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  securelint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, to find the changed lines
          persist-credentials: false
      # Pinned to a commit of SecureLint, like every other action.
      - uses: Fatennhrb/SecureLint@a822da532afa2ca546bbca24af04af65313b4e45
        with:
          # Also check dependencies and the Dockerfile with Trivy.
          trivy: "true"
          # Add an AI explanation to each note (settings in pyproject.toml).
          explain: "true"
        env:
          # A repository secret: never written in a file, hidden in the logs.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
